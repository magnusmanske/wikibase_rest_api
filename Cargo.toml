[package]
name = "wikibase_rest_api"
version = "0.2.1"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
edition = "2021"
rust-version = "1.87"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["wikibase", "REST", "API", "client"]
categories = ["api-bindings"]
description = "A Rust client for the Wikibase REST API."
repository = "https://github.com/magnusmanske/wikibase_rest_api"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[lints.clippy]
unwrap_used = "deny"

[dependencies]
httpdate = "1"
derive-where = "1.6"
futures = "0.3"
json-patch = "4"
reqwest = { version = "0.13", features = ["json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
regex = "1"
nutype = { version = "0.7", features = ["regex"] }

[dev-dependencies]
wiremock = "0.6"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
