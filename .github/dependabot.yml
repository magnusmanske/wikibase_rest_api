version: 2
updates:
  # Rust crate dependencies (Cargo.toml / Cargo.lock)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      # Bundle routine (non-breaking) bumps into a single PR to reduce noise.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions used by CI up to date too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
